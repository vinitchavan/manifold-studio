name: package-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[viz]"
      - run: python -m unittest discover -s tests -v
      - run: manifold-studio demo --no-html --out outputs/ci

  train-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[train,viz]"
      - run: python -m unittest discover -s tests -v
      - run: python examples/train_projection.py --loss smtl --geometry 'sphere*torus' --steps 10
