[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manifold-studio"
version = "0.2.0"
description = "Composable manifold mappings, tangent geometry, and honest 3D embedding views"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Vinit K. Chavan"}]
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
train = ["torch>=2.2,<3"]
viz = ["plotly>=5.18,<7"]
text = ["sentence-transformers>=3,<6"]

[project.scripts]
manifold-studio = "manifold_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
